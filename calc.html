<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="util.css">
</head>
<body>
    <h1 class="text-center">Calculator</h1>
    <div class="container flex flex-col items-align mx-auto m-w-20">
        <div class="row">
            <input class="input" id="screen" type="text" readonly>
        </div>
        <div class="row">
        <button class="button" id="clear">C</button>
        <button class="button" id="percent">%</button>
        <button class="button" id="mplus">M+</button>
        <button class="button" id="mminus">M-</button>

    </div>
    <div class="row">
        <button class="button" id="btn7">7</button>
        <button class="button" id="btn8">8</button>
        <button class="button" id="btn9">9</button>
        <button class="button" id="multiply">*</button>

    </div>
    
    <div class="row">
        <button class="button" id="btn4">4</button>
        <button class="button" id="btn5">5</button>
        <button class="button" id="btn6">6</button>
        <button class="button" id="divide">/</button>

    </div>
    <div class="row">
        <button class="button" id="btn1">1</button>
        <button class="button" id="btn2">2</button>
        <button class="button" id="btn3">3</button>
        <button class="button" id="add">+</button>

    </div>
    <div class="row">
        <button class="button" id="btn0">0</button>
        <button class="button" id="dot">.</button>
        <button class="button" id="equal">=</button>
        <button class="button" id="minus">-</button>

    </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
